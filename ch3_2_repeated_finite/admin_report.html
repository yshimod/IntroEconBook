<h3>総獲得報酬ランキング</h3>
<table class="table table-bordered">
    <thead>
        <tr>
            <th>順位</th>
            <th>報酬</th>
        </tr>
    </thead>
    <tbody>
        {{ for el in ranking }}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ el }}</td>
        </tr>
        {{ endfor }}
    </tbody>
</table>

<p>&nbsp;</p>
<h3>協力率の推移</h3>
<div id="chart1" style="width: 900px; height: 500px;"></div>
