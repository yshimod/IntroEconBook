<style>
    .boxed-section {
        border: 2px solid #000;
        padding: 10px;
        margin: 10px 0;
    }
</style>

<script src="https://code.highcharts.com/highcharts.js"></script>
<script>
    const choice_label_A = "{{ C.CHOICE_LIST.0 }}";
    const choice_label_B = "{{ C.CHOICE_LIST.1 }}";

    function drawChart(domid) {
        Highcharts.chart(domid, {
            chart: {
                type: 'bar'
            },
            title: {
                text: "個人の選択"
            },
            subtitle: {
                text: js_vars.num_participants + "名が実験に参加しました"
            },
            xAxis: {
                categories: [choice_label_A + 'を選んだ人', choice_label_B + 'を選んだ人'],
                title: {
                    text: null
                }
            },
            yAxis: {
                min: 0,
                max: 100,
                title: {
                    text: null,
                },
                labels: {
                    overflow: 'justify'
                }
            },
            series: [{
                name: '割合',
                data: [
                    { y: js_vars.prop_A, color: '#ff7f0e' },
                    { y: js_vars.prop_B, color: '#1f77b4' },
                ],
                dataLabels: { enabled: true, format: '{point.y:.2f}%' }
            }],
            tooltip: { enabled: false },
            legend: { enabled: false },
            credits: { enabled: false },
            accessibility: { enabled: false }
        });
    }

    function drawChart_pair(domid) {
        Highcharts.chart(domid, {
            chart: {
                type: 'bar'
            },
            title: {
                text: "ペアの選択の組み合わせ"
            },
            subtitle: {
                text: js_vars.num_pairs + "組が実験に参加しました"
            },
            xAxis: {
                categories: [
                    choice_label_A + choice_label_A,
                    choice_label_A + choice_label_B,
                    choice_label_B + choice_label_B
                ],
                title: {
                    text: null
                }
            },
            yAxis: {
                min: 0,
                max: 100,
                title: {
                    text: null,
                },
                labels: {
                    overflow: 'justify'
                }
            },
            series: [{
                name: '割合',
                data: [
                    js_vars.prop_pairs_AA,
                    js_vars.prop_pairs_AB,
                    js_vars.prop_pairs_BB
                ],
                dataLabels: { enabled: true, format: '{point.y:.2f}%' }
            }],
            tooltip: { enabled: false },
            legend: { enabled: false },
            credits: { enabled: false },
            accessibility: { enabled: false }
        });
    }
</script>
