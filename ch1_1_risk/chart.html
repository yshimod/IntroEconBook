<style>
    .boxed-section {
        /*creat a box*/
        border: 2px solid #000;
        padding: 10px;
        margin: 10px 0;
    }
</style>

<script src="https://code.highcharts.com/highcharts.js"></script>
<script src="https://code.highcharts.com/modules/series-label.js"></script>
<script>
    function drawChart1(num_participants, list_prop_A, domname = 'highchart', titlestr = '質問1～5における選択肢Aを選んだ個数の割合') {
        Highcharts.chart(domname, {
            chart: {
                type: 'bar'
            },
            title: {
                text: titlestr
            },
            subtitle: {
                text: num_participants + '名が実験に参加しました'
            },
            xAxis: {
                categories: ['Aが5個', 'Aが4個', 'Aが3個', 'Aが2個', 'Aが1個', 'Aが0個'],
                title: {
                    text: null
                }
            },
            yAxis: {
                min: 0,
                max: 100,
                title: {
                    text: null,
                },
                labels: {
                    overflow: 'justify'
                }
            },
            series: [{
                name: '割合',
                data: list_prop_A,
                color: '#1f77b4',
                dataLabels: { enabled: true, format: '{point.y:.2f}%' }
            }],
            tooltip: { enabled: false },
            legend: { enabled: false },
            credits: { enabled: false },
            accessibility: { enabled: false }
        });
    }


    function drawChart2(num_participants, prop_A, domname, titlestr) {
        Highcharts.chart(domname, {
            chart: {
                type: 'bar'
            },
            title: {
                text: titlestr
            },
            subtitle: {
                text: num_participants + '名が実験に参加しました'
            },
            xAxis: {
                categories: ['Aを選んだ人', 'Bを選んだ人'],
                title: {
                    text: null
                }
            },
            yAxis: {
                min: 0,
                max: 100,
                title: {
                    text: null,
                },
                labels: {
                    overflow: 'justify'
                }
            },
            series: [{
                name: '割合',
                data: [
                    { y: prop_A, color: '#ff7f0e' },
                    { y: 100 - prop_A, color: '#1f77b4' },
                ],
                dataLabels: { enabled: true, format: '{point.y:.2f}%' }
            }],
            tooltip: { enabled: false },
            legend: { enabled: false },
            credits: { enabled: false },
            accessibility: { enabled: false }
        });
    }

</script>
