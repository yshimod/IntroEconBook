<style>
    .boxed-section {
        border: 2px solid #000;
        padding: 10px;
        margin: 10px 0;
    }
</style>

<script src="https://code.highcharts.com/highcharts.js"></script>
<script>
    function drawChart(domid, js_vars) {
        Highcharts.chart(domid, {
            chart: {
                type: 'bar'
            },
            title: {
                text: "個人の選択"
            },
            subtitle: {
                text: js_vars.num_participants + "名が実験に参加しました"
            },
            xAxis: {
                categories: ['{{ C.CHOICE_LABEL_1 }}', '{{  C.CHOICE_LABEL_2 }}'],
                title: {
                    text: null
                }
            },
            yAxis: {
                min: 0,
                max: 100,
                title: {
                    text: null,
                },
                labels: {
                    overflow: 'justify'
                }
            },
            series: [{
                name: '割合',
                data: [
                    { y: js_vars.prop_A, color: '#ff7f0e' },
                    { y: js_vars.prop_B, color: '#1f77b4' },
                ],
                dataLabels: { enabled: true, format: '{point.y:.2f}%' }
            }],
            tooltip: { enabled: false },
            legend: { enabled: false },
            credits: { enabled: false },
            accessibility: { enabled: false }
        });
    }
</script>
