<style>
    .boxed-section {
        border: 2px solid #000;
        padding: 10px;
        margin: 10px 0;
    }
</style>

<script src="https://code.highcharts.com/highcharts.js"></script>
<script src="https://code.highcharts.com/modules/treemap.js"></script>
<script>
    const choice_label_A = "{{ C.CHOICE_LIST.0 }}";
    const choice_label_B = "{{ C.CHOICE_LIST.1 }}";

    function drawChartMosaic(domid, js_vars) {
        Highcharts.chart(domid, {
            title: { text: 'ペアの選択の組み合わせ（モザイクプロット）' },
            subtitle: {
                text: js_vars.num_pairs + "組が実験に参加しました"
            },
            series: [{
                type: 'treemap',
                layoutAlgorithm: 'sliceAndDice',
                levelIsConstant: false,
                levels: [
                    {
                        level: 1,    // First mover
                        layoutAlgorithm: 'sliceAndDice',
                        layoutStartingDirection: 'vertical',
                        dataLabels: {
                            enabled: true,
                            align: 'center',
                            verticalAlign: 'top',
                            style: { fontSize: '20px' },
                            formatter: function () {
                                const total = js_vars.num_pairs_AA + js_vars.num_pairs_AB + js_vars.num_pairs_BA + js_vars.num_pairs_BB;
                                const percent = (this.point.value / total * 100).toFixed(2);
                                return this.point.name + '<br>' + percent + '%';
                            }
                        }
                    },
                    {
                        level: 2,    // Second mover
                        layoutAlgorithm: 'sliceAndDice',
                        layoutStartingDirection: 'horizontal',
                        dataLabels: {
                            enabled: true,
                            align: 'center',
                            verticalAlign: 'bottom',
                            style: { fontSize: '16px' },
                            formatter: function () {
                                const parentValue = this.series.chart.get(this.point.parent).value;
                                const percent = (this.point.value / parentValue * 100).toFixed(2);
                                return this.point.name + '<br>' + percent + '%';
                            }
                        }
                    }
                ],
                data: [
                    // First mover
                    { id: 'a', name: '先手: ' + choice_label_A, value: js_vars.num_pairs_AA + js_vars.num_pairs_AB, sortIndex: 1 },
                    { id: 'b', name: '先手: ' + choice_label_B, value: js_vars.num_pairs_BA + js_vars.num_pairs_BB, sortIndex: 2 },
                    // Second mover
                    { parent: 'a', name: '後手: ' + choice_label_A, value: js_vars.num_pairs_AA, color: '#1f77b4', sortIndex: 3 },
                    { parent: 'a', name: '後手: ' + choice_label_B, value: js_vars.num_pairs_AB, color: '#ff7f0e', sortIndex: 4 },
                    { parent: 'b', name: '後手: ' + choice_label_A, value: js_vars.num_pairs_BA, color: '#17becf', sortIndex: 3 },
                    { parent: 'b', name: '後手: ' + choice_label_B, value: js_vars.num_pairs_BB, color: '#d62728', sortIndex: 4 }
                ],
            }],
            tooltip: { enabled: false },
            legend: { enabled: false },
            credits: { enabled: false },
            accessibility: { enabled: false }
        });
    }

    function drawChart_pair(domid, js_vars) {
        const total = js_vars.num_pairs_AA + js_vars.num_pairs_AB + js_vars.num_pairs_BA + js_vars.num_pairs_BB;
        const prop_AA = (js_vars.num_pairs_AA / total * 100);
        const prop_AB = (js_vars.num_pairs_AB / total * 100);
        const prop_BA = (js_vars.num_pairs_BA / total * 100);
        const prop_BB = (js_vars.num_pairs_BB / total * 100);

        Highcharts.chart(domid, {
            chart: {
                type: 'bar'
            },
            title: {
                text: "ペアの選択の組み合わせ"
            },
            subtitle: {
                text: js_vars.num_pairs + "組が実験に参加しました"
            },
            xAxis: {
                categories: [
                    choice_label_A + " → " + choice_label_A,
                    choice_label_A + " → " + choice_label_B,
                    choice_label_B + " → " + choice_label_A,
                    choice_label_B + " → " + choice_label_B
                ],
                title: {
                    text: null
                }
            },
            yAxis: {
                min: 0,
                max: 100,
                title: {
                    text: null,
                },
                labels: {
                    overflow: 'justify'
                }
            },
            series: [{
                name: '割合',
                data: [
                    prop_AA,
                    prop_AB,
                    prop_BA,
                    prop_BB
                ],
                dataLabels: { enabled: true, format: '{point.y:.2f}%' }
            }],
            tooltip: { enabled: false },
            legend: { enabled: false },
            credits: { enabled: false },
            accessibility: { enabled: false }
        });
    }
</script>
