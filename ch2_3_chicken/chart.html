<style>
    .boxed-section {
        border: 2px solid #000;
        padding: 10px;
        margin: 10px 0;
    }
</style>

<script src="https://code.highcharts.com/highcharts.js"></script>
<script src="https://code.highcharts.com/modules/series-label.js"></script>
<script>
    function drawChart() {
        disp_title = js_vars.num_participants + "名が実験に参加しました。"
        Highcharts.chart('highchart', {
            chart: {
                type: 'bar'
            },
            title: {
                text: disp_title
            },
            subtitle: {
                text: ''
            },
            xAxis: {
                categories: ['Aを選んだ人', 'Bを選んだ人'],
                title: {
                    text: null
                }
            },
            yAxis: {
                min: 0,
                max: 100,
                title: {
                    text: '',
                    align: 'high'
                },
                labels: {
                    overflow: 'justify'
                }
            },
            tooltip: {
                valueSuffix: ' %'
            },
            plotOptions: {
                bar: {
                    dataLabels: {
                        enabled: true
                    }
                }
            },
            legend: {
                layout: 'vertical',
                align: 'right',
                verticalAlign: 'top',
                x: -40,
                y: 80,
                floating: true,
                borderWidth: 1,
                backgroundColor:
                    Highcharts.defaultOptions.legend.backgroundColor || '#FFFFFF',
                shadow: true
            },
            credits: {
                enabled: false
            },
            series: [{
                name: '%',
                data: [
                    { y: js_vars.prop_A, color: 'orange' },
                    { y: js_vars.prop_B, color: 'green' },
                ]
            }]
        });
    }
    //}
    function drawChart_pair() {
        disp_title = "（コンピュータを含む）" + js_vars.num_pairs + "組が実験に参加しました。"
        Highcharts.chart('highchart2', {
            chart: {
                type: 'bar'
            },
            title: {
                text: disp_title
            },
            subtitle: {
                text: ''
            },
            xAxis: {
                categories: ['AA', 'AB', 'BA', 'BB'],
                title: {
                    text: null
                }
            },
            yAxis: {
                min: 0,
                max: 100,
                title: {
                    text: '',
                    align: 'high'
                },
                labels: {
                    overflow: 'justify'
                }
            },
            tooltip: {
                valueSuffix: '%'
            },
            plotOptions: {
                bar: {
                    dataLabels: {
                        enabled: true
                    }
                }
            },
            legend: {
                layout: 'vertical',
                align: 'right',
                verticalAlign: 'top',
                x: -40,
                y: 80,
                floating: true,
                borderWidth: 1,
                backgroundColor:
                    Highcharts.defaultOptions.legend.backgroundColor || '#FFFFFF',
                shadow: true
            },
            credits: {
                enabled: false
            },
            series: [{
                name: '%',
                data: [
                    { y: js_vars.prop_pairs_AA, color: '#87cefa' },
                    { y: js_vars.prop_pairs_AB, color: '#87cefa' },
                    { y: js_vars.prop_pairs_BB, color: '#87cefa' },
                ]
            }]
        });
    }
</script>
