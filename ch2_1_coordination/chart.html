<style>
    .boxed-section {
        border: 2px solid #000;
        padding: 10px;
        margin: 10px 0;
    }
</style>

<script src="https://code.highcharts.com/highcharts.js"></script>
<script src="https://code.highcharts.com/modules/series-label.js"></script>
<script>
    const choice_label_A = "{{ C.CHOICE_LABEL }}{{ C.CHOICE_LIST.0 }}";
    const choice_label_B = "{{ C.CHOICE_LABEL }}{{ C.CHOICE_LIST.1 }}";

    function drawChart_series(domid, data, title_text) {
        const round_nums = [...Array(data.length).keys()].map(i => i + 1);

        Highcharts.chart(domid, {
            chart: {
                type: 'column'
            },
            title: {
                text: title_text
            },
            subtitle: {
                text: null
            },
            xAxis: {
                categories: round_nums,
                title: {
                    text: "ラウンド"
                }
            },
            yAxis: {
                min: 0,
                max: 100,
                title: {
                    text: null,
                },
                labels: {
                    overflow: 'justify'
                }
            },
            series: [{
                name: '割合',
                data: data,
                dataLabels: { enabled: true, format: '{point.y:.2f}%' }
            }],
            tooltip: { enabled: false },
            legend: { enabled: false },
            credits: { enabled: false },
            accessibility: { enabled: false }
        });
    }

    function drawChart_pair(domid, js_vars) {
        Highcharts.chart(domid, {
            chart: {
                type: 'bar'
            },
            title: {
                text: "ペアの選択の組み合わせ"
            },
            subtitle: {
                text: js_vars.num_pairs + "組が実験に参加しました"
            },
            xAxis: {
                categories: [
                    choice_label_A + ", " + choice_label_A,
                    choice_label_A + ", " + choice_label_B,
                    choice_label_B + ", " + choice_label_A,
                    choice_label_B + ", " + choice_label_B
                ],
                title: {
                    text: null
                }
            },
            yAxis: {
                min: 0,
                max: 100,
                title: {
                    text: null,
                },
                labels: {
                    overflow: 'justify'
                }
            },
            series: [{
                name: '割合',
                data: [
                    js_vars.prop_pairs_AA,
                    js_vars.prop_pairs_AB,
                    js_vars.prop_pairs_BA,
                    js_vars.prop_pairs_BB
                ],
                dataLabels: { enabled: true, format: '{point.y:.2f}%' }
            }],
            tooltip: { enabled: false },
            legend: { enabled: false },
            credits: { enabled: false },
            accessibility: { enabled: false }
        });
    }
</script>
